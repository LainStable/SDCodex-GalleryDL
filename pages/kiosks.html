<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GalleryDL — Kiosks · SDCodex</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = { darkMode: "class", theme: { extend: { colors: {
  background: "#0f131c", surface: "#0f131c", "surface-container-lowest": "#0a0e17",
  "surface-container-low": "#181b25", "surface-container": "#1c1f29",
  "surface-container-high": "#262a34", "surface-container-highest": "#31353f",
  "slate-surface": "#1E293B",
  "badge-checkpoint": "#6366F1", "badge-sdxl": "#06B6D4", "badge-lora": "#8B5CF6", "badge-flux": "#EC4899",
  primary: "#c0c1ff", secondary: "#4cd7f6", tertiary: "#d0bcff",
  "status-active": "#10B981", "status-warning": "#F59E0B", "status-alert": "#EF4444",
  "on-surface": "#dfe2ef", "on-surface-variant": "#c7c4d7", outline: "#908fa0", "outline-variant": "#464554"
}, fontFamily: { display: ["Geist"], body: ["Inter"], mono: ["JetBrains Mono"] } } } };
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; font-size: 18px; line-height: 1; display: inline-block; vertical-align: middle; }
</style>
<style>
/* iframe-width guards: never force the page wider than the frame */
.gdl-page { max-width: 100%; overflow-x: clip; }
.gdl-page table { table-layout: fixed; width: 100%; }
.gdl-page pre { white-space: pre-wrap; word-break: break-word; }
.gdl-page [class*="col-span"] { min-width: 0; }
.gdl-page img { max-width: 100%; }
</style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen font-body">
<div class="gdl-page mx-auto max-w-full p-4 md:p-6 flex flex-col gap-6">

  <nav class="flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.06em]">
    <span class="flex items-center gap-2 text-white font-semibold mr-2">
      <span class="material-symbols-outlined text-badge-sdxl" style="font-variation-settings:'FILL' 1;">cloud_download</span>
    </span>
    <span class="text-ink-faint">· Kiosks</span>
  </nav>

  <section class="rounded-lg border border-outline-variant/30 bg-surface-container-low p-5 flex flex-wrap items-center justify-between gap-4 relative overflow-hidden">
    <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-badge-sdxl/60 to-transparent"></div>
    <div>
      <h1 class="font-display text-2xl font-bold tracking-tight flex items-center gap-2"><span class="material-symbols-outlined text-secondary">slideshow</span>Kiosk Slideshow Mode</h1>
      <p class="mt-1 font-mono text-[11px] text-outline">Fullscreen attend-mode displays cycling freshly scraped media. Bind a kiosk to any ingest folder.</p>
    </div>
    <button onclick="gdlKioskNew()" class="sd-btn sd-btn-primary">
      <span class="material-symbols-outlined text-sm">add</span> New Kiosk
    </button>
  </section>

  <div id="kiosk-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="col-span-full py-8 text-center font-mono text-[11px] text-outline">loading…</div>
  </div>
  <div id="kiosk-images" class="hidden rounded-xl border border-outline-variant/30 bg-surface-container-low p-5"><div class="flex justify-between items-center mb-3"><h2 id="ki-title" class="font-display font-semibold">Kiosk settings &amp; images</h2><button onclick="document.getElementById('kiosk-images').classList.add('hidden')" class="sd-btn sd-btn-sm">Close</button></div><div class="grid grid-cols-2 md:grid-cols-4 gap-2 font-mono text-[10px]"><label>Name<input id="ki-name" class="block w-full rounded border border-outline-variant/40 bg-surface-container-lowest p-2"/></label><label>Interval (sec)<input id="ki-interval" type="number" min="1" max="3600" class="block w-full rounded border border-outline-variant/40 bg-surface-container-lowest p-2"/></label><label>Order<select id="ki-order" class="block w-full rounded border border-outline-variant/40 bg-surface-container-lowest p-2"><option value="random">Random</option><option value="sequential">Sequential</option></select></label><label>Transition<select id="ki-transition" class="block w-full rounded border border-outline-variant/40 bg-surface-container-lowest p-2"><option value="fade">Crossfade</option><option value="cut">Cut</option><option value="slide">Slide</option></select></label><label>Transition speed<input id="ki-speed" type="number" min="0.1" max="3" step="0.1" class="block w-full rounded border border-outline-variant/40 bg-surface-container-lowest p-2"/></label><label>Fit<select id="ki-fit" class="block w-full rounded border border-outline-variant/40 bg-surface-container-lowest p-2"><option>contain</option><option>cover</option></select></label><label>Background<input id="ki-background" class="block w-full rounded border border-outline-variant/40 bg-surface-container-lowest p-2"/></label><label class="flex items-center gap-2"><input id="ki-clock" type="checkbox"/>Show clock</label></div><button id="ki-save" class="mt-3 sd-btn sd-btn-sm">Save settings</button><span id="ki-message" class="ml-2 font-mono text-[10px] text-outline"></span><div class="mt-4"><input id="ki-files" type="file" multiple accept="image/*" class="text-xs"/><button id="ki-upload" class="ml-2 sd-btn sd-btn-primary sd-btn-sm">Upload images</button></div><div id="ki-grid" class="mt-3 flex flex-wrap gap-2"></div></div>
  <label id="ki-kenburns-wrap" class="hidden -mt-3 self-start flex items-center gap-2 rounded border border-outline-variant/30 p-2 font-mono text-[10px]"><input id="ki-kenburns" type="checkbox" class="rounded accent-[#6366f1]"/>Ken Burns motion</label>

  <script>
  (function () {
    const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    async function api(url, opts) {
      const r = await fetch(url, { credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, ...(opts || {}) });
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.json();
    }
    window.gdlKiosk = async (id, action) => {
      if (action === 'toggle') await api(`/gdl/api/kiosks/${id}/toggle`, { method: 'POST' });
      if (action === 'delete' && confirm('Delete kiosk?')) await api(`/gdl/api/kiosks/${id}`, { method: 'DELETE' });
      void refresh();
    };
    window.gdlKioskNew = async () => {
      const name = prompt('Kiosk name:', 'Lab Wall');
      if (!name) return;
      await api('/gdl/api/kiosks', { method: 'POST', body: JSON.stringify({ name }) });
      void refresh();
    };
    let editingKiosk='';
    document.querySelector('#kiosk-images > div button')?.addEventListener('click',()=>document.getElementById('ki-kenburns-wrap').classList.add('hidden'));
    window.gdlKioskImages=async(id)=>{editingKiosk=id;document.getElementById('kiosk-images').classList.remove('hidden');document.getElementById('ki-kenburns-wrap').classList.remove('hidden');const d=await api('/gdl/api/kiosks'),k=(d.kiosks||[]).find(x=>x.id===id)||{};document.getElementById('ki-title').textContent=(k.name||id)+' · settings & images';for(const [key,id2] of [['name','ki-name'],['interval','ki-interval'],['order','ki-order'],['transition','ki-transition'],['trans_speed','ki-speed'],['fit','ki-fit'],['background','ki-background']])document.getElementById(id2).value=k[key]??({interval:30,order:'random',transition:'fade',trans_speed:0.9,fit:'contain',background:'black'}[key]||'');document.getElementById('ki-clock').checked=!!k.show_clock;document.getElementById('ki-kenburns').checked=!!k.ken_burns;await loadKioskImages()};
    async function loadKioskImages(){const d=await api(`/gdl/api/kiosks/${editingKiosk}/images`);document.getElementById('ki-grid').innerHTML=(d.images||[]).map(n=>`<div class="relative"><img class="h-24 w-24 rounded object-cover" src="/gdl/api/kiosk/${editingKiosk}/media/${encodeURIComponent(n)}"><button onclick="gdlKioskImageDelete('${encodeURIComponent(n)}')" class="absolute right-1 top-1 sd-btn sd-btn-icon">×</button></div>`).join('')||'<span class="text-outline font-mono text-xs">No uploaded images.</span>'};
    window.gdlKioskImageDelete=async n=>{await api(`/gdl/api/kiosks/${editingKiosk}/images/${n}`,{method:'DELETE'});await loadKioskImages();void refresh()};
    document.getElementById('ki-save').onclick=async()=>{const p={name:document.getElementById('ki-name').value,interval:Number(document.getElementById('ki-interval').value),order:document.getElementById('ki-order').value,shuffle:document.getElementById('ki-order').value==='random',transition:document.getElementById('ki-transition').value,trans_speed:Number(document.getElementById('ki-speed').value),fit:document.getElementById('ki-fit').value,background:document.getElementById('ki-background').value,show_clock:document.getElementById('ki-clock').checked,ken_burns:document.getElementById('ki-kenburns').checked};try{await api(`/gdl/api/kiosks/${editingKiosk}`,{method:'PUT',body:JSON.stringify(p)});document.getElementById('ki-message').textContent='saved';void refresh()}catch(e){document.getElementById('ki-message').textContent=e.message}};
    document.getElementById('ki-upload').onclick=async()=>{const fd=new FormData();for(const f of document.getElementById('ki-files').files)fd.append('images',f);const r=await fetch(`/gdl/api/kiosks/${editingKiosk}/images`,{method:'POST',credentials:'same-origin',body:fd});const d=await r.json();if(!r.ok)alert(d.error||r.status);document.getElementById('ki-files').value='';await loadKioskImages();void refresh()};
    function card(k) {
      const live = !!k.live;
      return `<div class="rounded-xl border ${live ? 'border-status-active/30' : 'border-outline-variant/30'} bg-surface-container-low overflow-hidden">
        <div class="relative h-40 bg-surface-container-lowest flex items-center justify-center">
          <span class="material-symbols-outlined text-5xl ${live ? 'text-white/25' : 'text-white/10'}">slideshow</span>
          <span class="absolute top-3 left-3 rounded-[3px] border px-2 py-0.5 font-mono text-[10px] font-bold ${live ? 'border-status-active/40 text-status-active' : 'border-outline-variant/40 text-outline'}">${live ? 'LIVE' : 'IDLE'}</span>
        </div>
        <div class="p-4 flex flex-col gap-2">
          <div class="flex items-center justify-between">
            <h2 class="font-display font-semibold">${esc(k.name)}</h2>
            <span class="font-mono text-[10px] text-outline">${esc(k.folder || '')}</span>
          </div>
          <div class="flex items-center gap-4 font-mono text-[11px] text-outline">
            <span>Interval <strong class="text-white">${k.interval || 10}s</strong></span>
            <span>Shuffle <strong>${k.shuffle ? 'on' : 'off'}</strong></span>
          </div>
          <div class="flex gap-2 pt-1">
            <button onclick="gdlKiosk('${k.id}','toggle')" class="flex-1 sd-btn ${live ? '' : 'sd-btn-primary'}">${live ? 'Pause' : 'Start Display'}</button>
            <a href="${esc(k.view_url)}" target="_blank" class="sd-btn sd-btn-sm">Open</a>
            <button onclick="gdlKioskImages('${k.id}')" class="sd-btn sd-btn-sm">Images ${k.image_count||0}</button>
            <button onclick="gdlKiosk('${k.id}','delete')" class="sd-btn sd-btn-danger"><span class="material-symbols-outlined text-sm">delete</span></button>
          </div>
        </div>
      </div>`;
    }
    async function refresh() {
      try {
        const j = await api('/gdl/api/kiosks');
        document.getElementById('kiosk-grid').innerHTML = (j.kiosks || []).length === 0
          ? '<div class="col-span-full rounded-xl border border-dashed border-outline-variant/40 py-10 text-center font-mono text-[11px] text-outline">No kiosks yet — create one above.</div>'
          : j.kiosks.map(card).join('');
      } catch (e) { /* retry */ }
    }
    void refresh();
    setInterval(refresh, 10000);
  })();
  </script>

  <!-- Kiosk settings strip -->
  <div class="rounded-xl border border-outline-variant/30 bg-surface-container-low p-5">
    <div class="flex items-center gap-2 mb-3"><span class="material-symbols-outlined text-badge-checkpoint">tune</span><h2 class="font-display font-semibold">Display Defaults</h2></div>
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 font-mono text-[11px]">
      <label class="flex flex-col gap-1"><span class="uppercase text-outline text-[10px]">Slide interval</span>
        <select id="kd-interval" class="rounded-lg border border-outline-variant/40 bg-surface-container-lowest px-2 py-1.5"><option value="10">10s</option><option value="30">30s</option><option value="60">60s</option></select></label>
      <label class="flex flex-col gap-1"><span class="uppercase text-outline text-[10px]">Transition</span>
        <select id="kd-transition" class="rounded-lg border border-outline-variant/40 bg-surface-container-lowest px-2 py-1.5"><option value="fade">Crossfade</option><option value="cut">Cut</option><option value="slide">Slide</option></select></label>
      <label class="flex items-center gap-2 rounded-[3px] border border-outline-variant/30 bg-surface-container-lowest p-2 cursor-pointer"><input id="kd-shuffle" type="checkbox" class="accent-[#6366f1]"/>Shuffle order</label>
      <label class="flex items-center gap-2 rounded-[3px] border border-outline-variant/30 bg-surface-container-lowest p-2 cursor-pointer"><input id="kd-blur" type="checkbox" class="accent-[#6366f1]"/>Blur NSFW</label>
    </div>
    <button id="kd-save" class="mt-3 sd-btn sd-btn-primary">Save defaults</button><span id="kd-message" class="ml-2 font-mono text-[10px] text-outline"></span>
  </div>
</div>
<script>
(function(){const $=id=>document.getElementById(id);async function load(){try{const r=await fetch('/gdl/api/kiosks/defaults',{credentials:'same-origin'}),d=await r.json(),x=d.defaults||{};$('kd-interval').value=x.interval||30;$('kd-transition').value=x.transition||'fade';$('kd-shuffle').checked=!!x.shuffle;$('kd-blur').checked=!!x.blur_nsfw}catch(_){}}$('kd-save').onclick=async()=>{const body={interval:Number($('kd-interval').value),transition:$('kd-transition').value,shuffle:$('kd-shuffle').checked,blur_nsfw:$('kd-blur').checked};try{const r=await fetch('/gdl/api/kiosks/defaults',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();$('kd-message').textContent=d.ok?'saved':(d.error||'save failed')}catch(_){$('kd-message').textContent='save failed'}};void load()})();
</script>
<script>
(function () {
  const m = location.pathname.match(/\/plugins\/([^/]+)\/page\//);
  if (!m) return;
  const base = `/api/plugins/${m[1]}/page/`;
  document.querySelectorAll('a[href$=".html"]').forEach((a) => {
    const name = a.getAttribute('href').replace(/\.html$/, '');
    a.setAttribute('href', base + name);
  });
})();
</script>
</body>
</html>
