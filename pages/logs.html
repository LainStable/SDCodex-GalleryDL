<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GalleryDL — Logs · SDCodex</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = { darkMode: "class", theme: { extend: { colors: {
  background: "#0f131c", surface: "#0f131c", "surface-container-lowest": "#0a0e17",
  "surface-container-low": "#181b25", "surface-container": "#1c1f29",
  "surface-container-high": "#262a34", "surface-container-highest": "#31353f",
  "slate-surface": "#1E293B",
  "badge-checkpoint": "#6366F1", "badge-sdxl": "#06B6D4", "badge-lora": "#8B5CF6", "badge-flux": "#EC4899",
  primary: "#c0c1ff", secondary: "#4cd7f6", tertiary: "#d0bcff",
  "status-active": "#10B981", "status-warning": "#F59E0B", "status-alert": "#EF4444",
  "on-surface": "#dfe2ef", "on-surface-variant": "#c7c4d7", outline: "#908fa0", "outline-variant": "#464554"
}, fontFamily: { display: ["Geist"], body: ["Inter"], mono: ["JetBrains Mono"] } } } };
</script>
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20; font-size: 18px; line-height: 1; display: inline-block; vertical-align: middle; }
.scroll-thin::-webkit-scrollbar { width: 4px; height: 4px; }
.scroll-thin::-webkit-scrollbar-track { background: #0a0e17; }
.scroll-thin::-webkit-scrollbar-thumb { background: #31353f; border-radius: 4px; }
</style>
<style>
/* iframe-width guards: never force the page wider than the frame */
.gdl-page { max-width: 100%; overflow-x: clip; }
.gdl-page table { table-layout: fixed; width: 100%; }
.gdl-page pre { white-space: pre-wrap; word-break: break-word; }
.gdl-page [class*="col-span"] { min-width: 0; }
.gdl-page img { max-width: 100%; }
</style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen font-body">
<div class="gdl-page mx-auto max-w-full p-4 md:p-6 flex flex-col gap-6">

  <nav class="flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.06em]">
    <nav class="flex items-center gap-2 font-mono text-[11px] uppercase tracking-[0.06em]">
    <span class="flex items-center gap-2 text-white font-semibold mr-2">
      <span class="material-symbols-outlined text-badge-sdxl" style="font-variation-settings:'FILL' 1;">cloud_download</span>
    <span class="text-ink-faint">· Logs</span>
  </nav>

  <section class="rounded-lg border border-outline-variant/30 bg-surface-container-low p-5 flex flex-wrap items-center justify-between gap-4 relative overflow-hidden">
    <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-badge-checkpoint/60 to-transparent"></div>
    <div>
      <h1 class="font-display text-2xl font-bold tracking-tight flex items-center gap-2"><span class="material-symbols-outlined text-badge-checkpoint">list_alt</span>Persistent Activity Log</h1>
      <p class="mt-1 font-mono text-[11px] text-outline">Every scrape, verify, skip and rate-limit event — retained per task in <span class="text-secondary">/data/tasks</span>.</p>
    </div>
    <div class="flex items-center gap-2 font-mono text-[11px]">
      <select class="rounded-lg border border-outline-variant/40 bg-surface-container-lowest px-2 py-1.5"><option>All levels</option><option>Errors only</option><option>Warnings+</option></select>
      <select id="log-task" class="rounded-lg border border-outline-variant/40 bg-surface-container-lowest px-2 py-1.5"></select>
      <button class="rounded-lg border border-outline-variant/40 px-3 py-1.5 flex items-center gap-1.5 hover:border-badge-sdxl/60"><span class="material-symbols-outlined text-sm">output</span>Export</button>
    </div>
  </section>

  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="rounded-xl border border-outline-variant/30 bg-surface-container-low p-4"><div class="font-mono text-[10px] uppercase text-outline">Items today</div><div class="font-display text-2xl font-bold">1,204</div></div>
    <div class="rounded-xl border border-outline-variant/30 bg-surface-container-low p-4"><div class="font-mono text-[10px] uppercase text-outline">Bytes ingested</div><div class="font-display text-2xl font-bold">3.6 GB</div></div>
    <div class="rounded-xl border border-status-warning/30 bg-surface-container-low p-4"><div class="font-mono text-[10px] uppercase text-status-warning">Skipped / filtered</div><div class="font-display text-2xl font-bold">47</div></div>
    <div class="rounded-xl border border-status-alert/30 bg-surface-container-low p-4"><div class="font-mono text-[10px] uppercase text-status-alert">Errors</div><div class="font-display text-2xl font-bold">3</div></div>
  </div>

  <div class="rounded-xl border border-outline-variant/30 bg-surface-container-low overflow-hidden">
    <div class="px-4 py-2 bg-surface-container-lowest border-b border-outline-variant/30 flex items-center justify-between">
      <div class="flex items-center gap-2 font-mono text-[11px]"><span class="material-symbols-outlined text-xs text-status-active">terminal</span><span class="font-semibold">gallery-dl.stdout.log</span></div>
      <div class="flex items-center gap-2 font-mono text-[10px] text-outline">
        <span class="flex items-center gap-1.5"><span class="h-2 w-2 rounded-full bg-status-active animate-ping"></span>Tail -f</span>
        <button class="p-1 hover:text-white"><span class="material-symbols-outlined text-xs">content_copy</span></button>
      </div>
    </div>
    <div id="log-box" class="p-4 bg-[#070a10] font-mono text-[11px] leading-relaxed overflow-y-auto max-h-[420px] scroll-thin flex flex-col gap-1">
      <div class="text-outline">loading…</div>
    </div>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  async function jget(u) { const r = await fetch(u, { credentials: 'same-origin' }); if (!r.ok) throw new Error(u); return r.json(); }
  async function loadTasks() {
    try {
      const tj = await jget('/gdl/api/tasks');
      const sel = $('log-task');
      const cur = sel.value;
      sel.innerHTML = (tj.tasks || []).map((t) => `<option value="${t.slug}">${esc(t.name)} (${esc(t.state)})</option>`).join('')
        || '<option value="">no tasks yet</option>';
      if (cur && [...sel.options].some((o) => o.value === cur)) sel.value = cur;
    } catch (e) { /* retry */ }
  }
  async function tail() {
    const slug = $('log-task').value;
    if (!slug) { $('log-box').innerHTML = '<div class="text-outline">no tasks yet.</div>'; return; }
    try {
      const lj = await jget(`/gdl/api/tasks/${slug}/log?lines=200`);
      $('log-box').innerHTML = (lj.lines || []).slice(-120).map((l) => `<div class="text-outline">${esc(l)}</div>`).join('')
        + '<div class="flex items-center gap-1 text-secondary"><span class="animate-pulse">❯</span><span class="text-outline">tail -f ' + esc(slug) + '</span></div>';
      $('log-box').scrollTop = $('log-box').scrollHeight;
    } catch (e) { /* retry */ }
  }
  $('log-task').addEventListener('change', tail);
  void loadTasks().then(tail);
  setInterval(async () => { await loadTasks(); await tail(); }, 5000);
})();
</script>
<script>
(function () {
  const m = location.pathname.match(/\/plugins\/([^/]+)\/page\//);
  if (!m) return;
  const base = `/api/plugins/${m[1]}/page/`;
  document.querySelectorAll('a[href$=".html"]').forEach((a) => {
    const name = a.getAttribute('href').replace(/\.html$/, '');
    a.setAttribute('href', base + name);
  });
})();
</script>
</body>
</html>
